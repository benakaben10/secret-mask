name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # GitHub release
      packages: write      # ghcr.io image
      id-token: write      # keyless signing (Sigstore) and provenance
      attestations: write  # build provenance stored on GitHub
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Test
        run: make test e2e

      - name: Binaries
        run: make binaries VERSION=${{ github.ref_name }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # SHA256SUMS lists every binary, so its signature covers them all. The Sigstore bundle holds the
      # signature and the certificate naming this workflow; install.sh verifies it when cosign is installed.
      # Sigstore's transparency log (Rekor) has short outages: retry with growing waits instead of failing
      # the release; a release is never published unsigned.
      - name: Sign checksums
        run: |
          for wait in 30 60 90 120 0; do
            cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS && exit 0
            [ "$wait" -gt 0 ] && { echo "::warning::signing failed, retrying in ${wait}s"; sleep "$wait"; }
          done
          exit 1

      # SLSA build provenance: which commit and workflow built each binary. Stored on GitHub
      # (gh attestation verify) and attached to the release.
      - name: Provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/secret-mask_*
      - run: cp "${{ steps.provenance.outputs.bundle-path }}" dist/secret-mask.intoto.jsonl

      - name: GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            dist/secret-mask_*
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json
            dist/secret-mask.intoto.jsonl

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/secret-mask:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/secret-mask:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT

      - name: Sign image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/secret-mask@${{ steps.image.outputs.digest }}
        run: |
          for wait in 30 60 90 120 0; do
            cosign sign --yes "$IMAGE" && exit 0
            [ "$wait" -gt 0 ] && { echo "::warning::signing failed, retrying in ${wait}s"; sleep "$wait"; }
          done
          exit 1

      - name: Image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/secret-mask
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
