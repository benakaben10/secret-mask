name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Unit and integration tests
        run: make test
      - name: End-to-end (release binary + image)
        run: make e2e
      - name: Image vulnerability scan
        run: make scan
