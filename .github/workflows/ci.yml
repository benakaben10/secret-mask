name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Unit and integration tests
        run: make test
      - name: End-to-end (release binary + image)
        run: make e2e
      - name: Image vulnerability scan
        run: make scan
