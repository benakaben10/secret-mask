name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit and integration tests
        run: make test
      - name: End-to-end (release binary + image)
        run: make e2e
      - name: Image vulnerability scan
        run: make scan
